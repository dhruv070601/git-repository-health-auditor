name: Git Repository Health Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit repository
        run: python -m git_health.auditor --repo . --out-dir health-results
      - name: Upload health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-repository-health-report
          path: health-results/
          if-no-files-found: warn
